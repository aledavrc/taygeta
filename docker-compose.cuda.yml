# ============================================================================
# Taygeta — NVIDIA/CUDA override (section 12.3). It is NOT a complete
# definition: it only modifies the `ocr` service on top of the base Compose.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.cuda.yml up --build
#
# Host requirements:
#   - NVIDIA driver + NVIDIA Container Toolkit.
#   - Modern Compose v2 with support for `deploy.resources.reservations.devices`.
#   - Prior check:
#       docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi
#
# To reserve specific GPUs, replace `count: all` with `device_ids: ["0"]`
# or use `count: 1`.
# Do not mix with docker-compose.rocm.yml.
# ============================================================================
services:
  ocr:
    build:
      context: .
      dockerfile: docker/ocr/Dockerfile.cuda
      # CUDA architectures to compile. Includes sm_90 (Hopper); adjust to the
      # actual deployment GPUs.
      args:
        CUDA_ARCHITECTURES: "${CUDA_ARCHITECTURES:-61;70;75;80;86;89;90}"
    image: taygeta-ocr:cuda
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OCR_GPU_LAYERS: 99
      # Aborts if no GPU is detected instead of silently falling back to CPU.
      OCR_REQUIRE_GPU: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
