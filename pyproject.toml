[project]
name = "taygeta"
version = "0.1.0"
description = "Scientific exam bank and MCP retrieval system: hybrid ingestion, HITL, RAG and Typst compilation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "mcp[cli]>=1.3.0,<2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "instructor>=1.7.0",
    "openai>=1.60.0",
    "sentence-transformers>=3.0.0",
    # Declared as a direct dependency so the CPU index of PyTorch can be forced
    # in [tool.uv.sources] (uv only honors `sources` for direct dependencies).
    # Avoids the CUDA/NVIDIA wheels on AMD hardware.
    "torch>=2.0.0",
    "pymupdf>=1.25.0",
    "pillow>=11.0.0",
    "pandoc>=2.4",
    "boto3>=1.35.0",
    # LaTeX↔Typst converter in Rust (tylax) for the transpiler's formulas.
    # abi3 wheel (cp310+) → compatible with Python 3.11; requires glibc >= 2.34.
    "tylax>=0.3.8,<1",
    # HITL UI (manual figure review and cropping) on top of FastAPI.
    "nicegui>=3.18.0",
    # Statement rendering in the UI: markdown2 (the one NiceGUI uses) with
    # protection of TeX formulas before rendering (see ui/nice/math_render.py).
    "markdown2>=2.5.0",
]

[project.scripts]
taygeta-ingest = "taygeta.ingest.pipeline:main"
taygeta-server = "taygeta.server.mcp_server:main"
taygeta-ui = "taygeta.ui.nice.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taygeta"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    # pytest plugin for the async tests of the NiceGUI harness (`user_simulation`).
    "anyio>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pyright>=1.1.414",
    "ruff-lsp>=0.0.62",
]

# ---------------------------------------------------------------------------
# PyTorch for CPU (AMD environment): the generic PyPI wheel drags in large
# CUDA/NVIDIA dependencies through sentence-transformers. An explicit index is
# pinned with the +cpu builds, used only by the PyTorch packages.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
